[project]
name = 'mc'
repo = '.'
base_branch = 'main'
max_agents = 7
min_ram_mb = 1024
prompt_dir = 'swarm/prompts'
tracker = 'swarm/tracker.json'

[backend]
type = 'codex-tmux'
model = 'gpt-5.3-codex'
binary = ''
effort = 'high'
bypass_sandbox = true

[notifications]
type = 'stdout'
telegram_chat_id = ''
telegram_token = ''

[watchdog]
interval = '5m'
max_runtime = '45m'
stale_timeout = '10m'
max_retries = 2
auto_approve = false

[integration]
verify_cmd = ''
audit_ticket = ''

[serve]
port = 8090
cors = []
auth_token = ''

[install]
method = ''
interval = '5m'
run_mode = 'timer'
